[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    requires_db: mark test as requiring a live DB connection (skipped if DB unavailable)
filterwarnings =
    # pandas/geopandas read_sql get a raw psycopg connection (not SQLAlchemy); works fine, pandas just doesn't test it
    ignore:pandas only supports SQLAlchemy connectable:UserWarning
