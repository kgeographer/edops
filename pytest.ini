[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    requires_db: mark test as requiring a live DB connection (skipped if DB unavailable)
    engine: engine contract tests (tests/engine)
    ui: Playwright browser tests (tests/surface/test_sandbox_ui.py)
    sandbox: Sandbox route tests (tests/surface, not ui)
    cdop: CDOP distance and permutation tests (tests/cdop)
    regionality: regionality tests, incl. the signature regression baseline (tests/regionality)
    dashboard: dashboard page tests (tests/dashboard)
    live: live-server smoke tests (need EDOPS_LIVE_URL)
    whg: WHG profile and profile-page tests
    api: the remaining route and data tests (tests/test_*.py)
filterwarnings =
    # pandas/geopandas read_sql get a raw psycopg connection (not SQLAlchemy); works fine, pandas just doesn't test it
    ignore:pandas only supports SQLAlchemy connectable:UserWarning
