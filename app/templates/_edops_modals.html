<!-- Shared Guide/API modals. Used by sandbox_v3.html, explorer.html, and workbench.html
     (via base.html's modals-block override; formerly cdop_pilot.html, renamed 2026-08-05).
     The old workbench.html -- which relied on base.html's own inline default About/API modals,
     not this partial -- is archived to xarchive/ (gitignored). Those base.html defaults are
     now unreached by any live route, left in place rather than deleted in this pass.
     Guide modal replaced the retired About modal 2026-08-04 (DOCSv4 plumbing) -- shell is
     shared, body is per-page: includes "_guide_{{ active_page }}.html" (each caller sets
     active_page before including this partial). Placeholder content, per-page Guide design
     still TBD. -->

<!-- Guide Modal (2026-08-04, DOCSv4 plumbing): replaces the retired About modal. Per-page
     Guide content design is TBD -- this is a placeholder shell so the Guide link/modal wiring
     can ship ahead of prose. -->
<div class="modal fade" id="guide-modal" tabindex="-1" aria-labelledby="guide-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable" style="max-width: 75%;">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="guide-modal-label">Guide</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {% include "_guide_" ~ active_page ~ ".html" %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- API Guide Modal -->
<div class="modal fade" id="api-guide-modal" tabindex="-1" aria-labelledby="api-guide-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable" style="max-width: 80%;">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="api-guide-modal-label">EDOPS API Guide</h4>
        <div class="ms-auto me-3">
          <a href="/api/schema" target="_blank" class="btn btn-sm btn-outline-secondary">Interactive schema (Swagger) ↗</a>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <iframe src="/static/api_guide.html" style="width:100%; height:80vh; border:none;"></iframe>
      </div>
    </div>
  </div>
</div>
