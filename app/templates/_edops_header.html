<!-- Shared EDOPS header (2026-08-03 reorg). Used by sandbox.html, explorer.html, and
     workbench.html (formerly cdop_pilot.html, renamed 2026-08-05; converted from a base.html
     block-extending template to a standalone document like the other two, 2026-08-07 --
     base.html deleted, nothing else used it). Callers set two Jinja variables before including
     this file:
       page_title   -- e.g. "EDOPS Sandbox v0.4"
       active_page  -- one of 'sandbox' | 'explorer' | 'workbench', for the active nav-pill state
     Karl, 2026-08-03: "workable frame that can be tweaked later, progress not perfection." -->
<header class="mb-2">
  <div class="d-flex align-items-center justify-content-between py-2 border-bottom flex-wrap gap-2">
    <div class="d-flex align-items-center">
      <a href="/edops"><img src="/static/images/edops_header_400.jpg" alt="EDOPS" style="height:60px;" class="me-2"></a>
      <h4 class="mb-0">{{ page_title }}</h4>
    </div>
    <div class="edops-page-pills-wrap">
      <ul class="nav nav-pills nav-pills-sm edops-page-pills mb-0">
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'sandbox' else '' }}" href="/sandbox">Sandbox</a></li>
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'workbench' else '' }}" href="/workbench">Workbench</a></li>
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'explorer' else '' }}" href="/explorer">Data Explorer</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a href="#" class="text-decoration-none" data-bs-toggle="modal" data-bs-target="#documentation-modal">Documentation</a>
      <a href="#" class="text-decoration-none" data-bs-toggle="modal" data-bs-target="#api-guide-modal">API</a>
      <span class="badge rounded-pill bg-secondary-subtle text-dark fw-normal" style="font-size:0.85rem;">v0.4</span>
    </div>
  </div>
</header>
<script src="/static/js/edops_help.js" defer></script>
