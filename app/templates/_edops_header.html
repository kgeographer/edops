<!-- Shared EDOPS header (2026-08-03 reorg). Used by sandbox_v3.html, explorer.html, and
     cdop_pilot.html (via base.html's header-block override). Callers set two Jinja
     variables before including this file:
       page_title   -- e.g. "EDOPS Sandbox v0.4"
       active_page  -- one of 'sandbox' | 'explorer' | 'cdop', for the active nav-pill state
     Karl, 2026-08-03: "workable frame that can be tweaked later, progress not perfection." -->
<header class="mb-2">
  <div class="d-flex align-items-center justify-content-between py-2 border-bottom flex-wrap gap-2">
    <div class="d-flex align-items-center">
      <a href="/edops"><img src="/static/images/cp03_edop01.jpg" alt="EDOPS" style="height:60px;" class="me-2"></a>
      <h4 class="mb-0">{{ page_title }}</h4>
    </div>
    <div class="flex-fill d-flex justify-content-center">
      <ul class="nav nav-pills nav-pills-sm edops-page-pills mb-0">
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'sandbox' else '' }}" href="/sandbox">Sandbox</a></li>
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'explorer' else '' }}" href="/explorer">Data Explorer</a></li>
        <li class="nav-item"><a class="nav-link{{ ' active' if active_page == 'cdop' else '' }}" href="/cdop_tests">EDOPS &lt;&gt; CDOP</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a href="#" class="text-decoration-none" data-bs-toggle="modal" data-bs-target="#about-modal">About</a>
      <a href="#" class="text-decoration-none" data-bs-toggle="modal" data-bs-target="#api-guide-modal">API</a>
      <span class="badge rounded-pill bg-secondary-subtle text-dark fw-normal" style="font-size:0.85rem;">EDOPS v0.4</span>
    </div>
  </div>
</header>
