site_name: EDOPS Documentation
site_description: Documentation for the Environmental Dimensions of Place Service (EDOPS)
docs_dir: docsite
site_dir: site

theme:
  name: material

markdown_extensions:
  - toc:
      title: "Sections"
#      title: "Section contents"

hooks:
  - mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/embed.js
  - javascripts/external-links.js

nav:
  - Introduction: index.md
  - Claims and limits: claims.md
  - Sandbox:
      - Overview: sandbox/overview.md
      - Reading a signature: sandbox/reading-a-signature.md
      - "Walkthrough: Settlement": sandbox/walkthrough-settlement.md
      - "Walkthrough: Polity": sandbox/walkthrough-polity.md
  - Data Explorer:
      - Overview: explorer/overview.md
  - Workbench:
      - Overview: workbench/overview.md
  - Similarity in EDOPS: similarity.md
  - Codebook: codebook.md
  - Data sources: data-sources.md
  - API: api.md
  - About the project: project.md
